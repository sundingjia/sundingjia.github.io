# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: "科苑闲话 "
subtitle: '孙鼎嘉的blog'
description: '醒醒，星星'
keywords: 学习,OI,随笔,闲话,个人记录,休闲娱乐,博客,科技工程,游记
author: sundingjia
language: zh-CN
timezone: 'Asia/Shanghai'


# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://sundingjia.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks
navbar:
  blog_title: 科苑闲话
# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

favicon: https://cdn.luogu.com.cn/upload/image_hosting/e6xzs86x.png
# icon: https://cdn.luogu.com.cn/upload/image_hosting/bjqt7kru.png

archive:
  banner_img: https://cdn.luogu.com.cn/upload/image_hosting/1alveikm.png    # 头图路径，推荐使用绝对路径
  banner_img_height: 100                 # 高度（占视窗百分比）
  banner_mask_alpha: 0.4                # 蒙版透明度，平衡背景与文字对比

about:
  banner_img: https://cdn.luogu.com.cn/upload/image_hosting/1alveikm.png    # 头图路径，推荐使用绝对路径
  banner_img_height: 100                 # 高度（占视窗百分比）
  banner_mask_alpha: 0.4                # 蒙版透明度，平衡背景与文字对比
  avatar: https://cdn.luogu.com.cn/upload/image_hosting/e6xzs86x.png
  name: "OIer_sundingjia"
  intro: "醒醒，星星"
  icon: true
  icons:
    - { class: 'iconfont icon-github-fill', link: 'https://github.com/sundingjia', tip: 'GitHub' }
    #- { class: 'iconfont icon-email-fill', link: 'mailto:OIsundingjia@outlook.com', tip: 'Email' }
    #- { class: 'iconfont icon-luogu-fill', link: 'mailto:OIsundingjia@outlook.com', tip: 'Email' }
    #- { img_src: "https://cdn.luogu.com.cn/upload/usericon/3.png", link: "https://www.luogu.com.cn/user/704139",tip: "Luogu"}


index:
  slogan:
    enable: true
    text: 这是一条 Slogan
    api:
      enable: true
      url: "https://v1.hitokoto.cn/"
      method: "GET"
      headers: {}
      keys: ["hitokoto"]
  banner_img: https://cdn.luogu.com.cn/upload/image_hosting/1alveikm.png    # 头图路径，推荐使用绝对路径
  banner_img_height: 100                 # 高度（占视窗百分比）
  banner_mask_alpha: 0.4                # 蒙版透明度，平衡背景与文字对比
post:
  default_index_img: https://cdn.luogu.com.cn/upload/image_hosting/swzbl3ap.png
  banner_img: https://cdn.luogu.com.cn/upload/image_hosting/1alveikm.png
  meta:
    author:  # 作者，优先根据 front-matter 里 author 字段，其次是 hexo 配置中 author 值
      enable: true
    date:  # 文章日期，优先根据 front-matter 里 date 字段，其次是 md 文件日期
       enable: true
       format: "dddd, MMMM Do YYYY, h:mm a"  # 格式参照 ISO-8601 日期格式化
    wordcount:  # 字数统计
      enable: true
      format: "{} 字"  # 显示的文本，{}是数字的占位符（必须包含)，下同
    min2read:  # 阅读时间
      enable: true
      format: "{} 分钟"
    views:  # 阅读次数
      enable: true
      source: "leancloud"  # 统计数据来源，可选：leancloud | busuanzi   注意不蒜子会间歇抽风
      format: "{} 次"
  math:
    enable: true
    # Choose KaTeX or MathJax
    engine: katex
  # Prevent double rendering by setting proper options
    katex:
     css: 
        cdn: https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css
     js: 
        cdn: https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js
      # Disable auto-render to prevent duplicate processing

  
  mermaid:
    enable: true
    specific: true
    options:
  code:
    copy_btn: true
    highlight:
      enable: true
      line_number: true
      lib: "highlightjs"
      highlightjs:
        style: 'Github Gist'
        bg_color: false
      prismjs:
        style: "default"
        preprocess: true
# Category & Tag
default_category: uncategorized
category_map:
tag_map:

tag:
  banner_img: https://cdn.luogu.com.cn/upload/image_hosting/1alveikm.png    # 头图路径，推荐使用绝对路径
  banner_img_height: 100                 # 高度（占视窗百分比）
  banner_mask_alpha: 0.4                # 蒙版透明度，平衡背景与文字对比
  tagcloud:
    min_font: 15
    max_font: 30
    unit: px  # 字号单位
    start_color: "#BBBBEE"
    end_color: "#337ab7"

category:
  banner_img: https://cdn.luogu.com.cn/upload/image_hosting/1alveikm.png    # 头图路径，推荐使用绝对路径
  banner_img_height: 100                 # 高度（占视窗百分比）
  banner_mask_alpha: 0.4                # 蒙版透明度，平衡背景与文字对比

    
# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: fluid


# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:sundingjia/sundingjia.github.io.git
  branch: gh-pages

custom_js:
  - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/DynamicRibbon.min.js # 动态彩带
  - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/runtime.min.js # 运行时间
  # - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/Ribbon.min.js # 静态彩带
  # - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/DynamicLine.min.js # 动态黑色线条
  # - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/snowflake.min.js # 小雪花飘落
  - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/Cherry.min.js #樱花飘落
  # - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/star.min.js # 鼠标跟随小星星
  - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/containsWord.min.js # 鼠标点击出字
  # - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/love.min.js #鼠标点击出爱心

custom_css:
  # - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/shubiao.css #鼠标指针
  # - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/scroll.css # 滚动条颜色
  - //cdn.jsdelivr.net/gh/EmoryHuang/BlogBeautify@1.1/gradient.css # 头部打字机颜色效果渐变